<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINOv3 Inferenza - Kvasir V2</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>DINOv3 Inferenza</h1>
            <p>Carica singole immagini o seleziona un'intera cartella per la predizione (Fold 1)</p>
        </header>

        <section class="upload-section">
            <div id="drop-zone" class="drop-zone glass-panel">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <h3>Trascina i file o le cartelle qui</h3>
                <p>Oppure usa uno dei pulsanti qui sotto</p>
                
                <div class="buttons">
                    <label for="file-upload" class="btn btn-primary">Scegli File</label>
                    <input type="file" id="file-upload" multiple accept="image/*" hidden />

                    <label for="folder-upload" class="btn btn-secondary">Scegli Cartella</label>
                    <input type="file" id="folder-upload" webkitdirectory directory multiple hidden />
                </div>
            </div>
        </section>

        <section id="results-section" class="results-section hidden">
            <div class="results-header">
                <h2>Risultati Predizione</h2>
                <button id="clear-btn" class="btn btn-danger">Pulisci</button>
            </div>
            
            <div id="loading-spinner" class="spinner-container hidden">
                <div class="spinner"></div>
                <p>Analisi in corso...</p>
            </div>

            <div id="results-grid" class="results-grid">
                <!-- Cards verranno generate qui via JS -->
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
